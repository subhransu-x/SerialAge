# wrangler.toml — Cloudflare Pages configuration for SerialAge
#
# Architecture: Cloudflare Pages static hosting.
# The SSG pipeline (npm run build) generates fully prerendered static HTML
# into dist/. Cloudflare Pages serves these files directly — no Workers SSR,
# no runtime Node.js, no edge functions.
#
# Why static hosting?
#   - prerender.mjs already generates per-route index.html files with
#     fully injected <head> tags (title, meta, canonical, JSON-LD).
#   - All decoding runs in the browser (pure client-side JS) — there is
#     no server-side dynamic behavior that requires edge compute.
#   - public/_redirects is a Cloudflare Pages native file that handles
#     the SPA fallback route and the custom 404. No Workers needed for routing.
#   - Adding Workers SSR would duplicate the existing prerender pipeline,
#     add latency, and introduce unnecessary complexity.
#
# Deployment target: Cloudflare Pages (NOT Workers)
# Output directory: dist/     (generated by npm run build)
# Build command:    npm run build
#
# DO NOT run `wrangler deploy` — that is for Workers.
# Cloudflare Pages deployments use `wrangler pages deploy` OR the
# Cloudflare dashboard connected to the Git repository.
# Neither should be triggered until DNS and domain are connected.
#
# Reference: https://developers.cloudflare.com/pages/configuration/
#

name = "serialage"

# ---------------------------------------------------------------------------
# Cloudflare Pages configuration
# ---------------------------------------------------------------------------
pages_build_output_dir = "dist"

# Compatibility date pins the Workers runtime version.
# Required even for Pages projects to ensure deterministic behavior.
compatibility_date = "2025-08-27"
